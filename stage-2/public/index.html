<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablekeeper - Search Availability</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input, select { padding: 8px; width: 200px; }
        button { padding: 10px 15px; background-color: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; margin-top: 20px; }
        .cell { padding: 10px; text-align: center; border: 1px solid #ccc; cursor: pointer; }
        .cell.available { background-color: #d4edda; }
        .cell.unavailable { background-color: #f8d7da; }
        .cell.selected { background-color: #007bff; color: white; }
        .booking-form { margin-top: 20px; }
        .confirmation { margin-top: 20px; padding: 15px; background-color: #d4edda; border: 1px solid #c3e6cb; }
        .error { color: red; margin-top: 10px; }
        .success { color: green; margin-top: 10px; }
        .loading { opacity: 0.5; }
    </style>
</head>
<body>
    <h1>Tablekeeper</h1>
    
    <!-- Header with user info -->
    <div id="header">
        <span data-testid="current-user" id="current-user"></span>
        <button data-testid="logout-button" id="logout-button" style="display:none;">Logout</button>
    </div>
    
    <!-- Search Form -->
    <div class="form-group">
        <label for="restaurant-select">Restaurant:</label>
        <select data-testid="restaurant-select" id="restaurant-select">
            <option value="">Select a restaurant</option>
        </select>
    </div>
    
    <div class="form-group">
        <label for="date-input">Date:</label>
        <input type="date" data-testid="date-input" id="date-input">
    </div>
    
    <div class="form-group">
        <label for="party-size-input">Party Size:</label>
        <input type="number" data-testid="party-size-input" id="party-size-input" min="1" max="20" value="2">
    </div>
    
    <button data-testid="search-button" id="search-button">Search Availability</button>
    
    <!-- Error Message -->
    <div data-testid="auth-error" id="auth-error" class="error" style="display:none;"></div>
    
    <!-- Availability Grid -->
    <div data-testid="availability-grid" id="availability-grid" class="grid"></div>
    
    <!-- Booking Form -->
    <div data-testid="booking-form" id="booking-form" class="booking-form" style="display:none;">
        <h3>Book a Table</h3>
        <div data-testid="booking-summary" id="booking-summary"></div>
        <div class="form-group">
            <label for="booking-party-size">Party Size:</label>
            <input type="number" data-testid="booking-party-size" id="booking-party-size" min="1" max="20">
        </div>
        <button data-testid="booking-submit" id="booking-submit">Confirm Booking</button>
        <div data-testid="booking-error" id="booking-error" class="error" style="display:none;"></div>
    </div>
    
    <!-- Confirmation -->
    <div data-testid="confirmation" id="confirmation" class="confirmation" style="display:none;">
        <h3>Booking Confirmed!</h3>
        <div data-testid="confirmation-reference" id="confirmation-reference"></div>
        <div data-testid="confirmation-details" id="confirmation-details"></div>
    </div>
    
    <script>
        // Simple state management
        let currentUser = null;
        let currentReservation = null;
        let currentSlot = null;
        
        // DOM Elements
        const restaurantSelect = document.getElementById('restaurant-select');
        const dateInput = document.getElementById('date-input');
        const partySizeInput = document.getElementById('party-size-input');
        const searchButton = document.getElementById('search-button');
        const availabilityGrid = document.getElementById('availability-grid');
        const bookingForm = document.getElementById('booking-form');
        const bookingSummary = document.getElementById('booking-summary');
        const bookingPartySize = document.getElementById('booking-party-size');
        const bookingSubmit = document.getElementById('booking-submit');
        const bookingError = document.getElementById('booking-error');
        const confirmation = document.getElementById('confirmation');
        const confirmationReference = document.getElementById('confirmation-reference');
        const confirmationDetails = document.getElementById('confirmation-details');
        const authError = document.getElementById('auth-error');
        const currentUserSpan = document.getElementById('current-user');
        const logoutButton = document.getElementById('logout-button');
        
        // Initialize the app
        function init() {
            // Set today's date as default
            const today = new Date().toISOString().split('T')[0];
            dateInput.value = today;
            
            // Load restaurants
            loadRestaurants();
            
            // Check for existing session
            checkAuthStatus();
            
            // Setup event listeners
            setupEventListeners();
        }
        
        // Load restaurants
        async function loadRestaurants() {
            try {
                const response = await fetch('/restaurants');
                const data = await response.json();
                
                // Populate restaurant dropdown
                restaurantSelect.innerHTML = '<option value="">Select a restaurant</option>';
                data.restaurants.forEach(restaurant => {
                    const option = document.createElement('option');
                    option.value = restaurant.id;
                    option.textContent = restaurant.name;
                    restaurantSelect.appendChild(option);
                });
            } catch (error) {
                console.error('Error loading restaurants:', error);
            }
        }
        
        // Check authentication status
        function checkAuthStatus() {
            const token = localStorage.getItem('token');
            if (token) {
                // Try to validate token
                fetch('/auth/validate', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                })
                .then(response => {
                    if (response.ok) {
                        return response.json();
                    } else {
                        throw new Error('Not authenticated');
                    }
                })
                .then(data => {
                    currentUser = data;
                    currentUserSpan.textContent = `Welcome, ${data.display_name}!`;
                    logoutButton.style.display = 'inline-block';
                })
                .catch(() => {
                    // Token invalid, clear it
                    localStorage.removeItem('token');
                    currentUser = null;
                    currentUserSpan.textContent = '';
                    logoutButton.style.display = 'none';
                });
            } else {
                currentUser = null;
                currentUserSpan.textContent = '';
                logoutButton.style.display = 'none';
            }
        }
        
        // Setup event listeners
        function setupEventListeners() {
            searchButton.addEventListener('click', searchAvailability);
            bookingSubmit.addEventListener('click', bookTable);
            logoutButton.addEventListener('click', logout);
        }
        
        // Search availability
        async function searchAvailability() {
            const restaurantId = restaurantSelect.value;
            const date = dateInput.value;
            const partySize = partySizeInput.value;
            
            if (!restaurantId) {
                alert('Please select a restaurant');
                return;
            }
            
            if (!date) {
                alert('Please select a date');
                return;
            }
            
            if (!partySize || partySize < 1) {
                alert('Please enter a valid party size');
                return;
            }
            
            try {
                // Show loading state
                availabilityGrid.innerHTML = '<div class="loading">Loading availability...</div>';
                
                const response = await fetch(`/availability?restaurant_id=${restaurantId}&date=${date}&party_size=${partySize}`);
                const data = await response.json();
                
                if (response.ok) {
                    renderAvailabilityGrid(data.slots, restaurantId);
                } else {
                    authError.textContent = data.error?.message || 'Error searching availability';
                    authError.style.display = 'block';
                }
            } catch (error) {
                console.error('Error searching availability:', error);
                authError.textContent = 'Network error while searching availability';
                authError.style.display = 'block';
            }
        }
        
        // Render availability grid
        function renderAvailabilityGrid(slots, restaurantId) {
            availabilityGrid.innerHTML = '';
            
            if (!slots || slots.length === 0) {
                availabilityGrid.innerHTML = '<div id="no-slots" data-testid="no-slots">No availability found for this date</div>';
                return;
            }
            
            // Group slots by time
            const slotMap = new Map();
            slots.forEach(slot => {
                const time = slot.starts_at_local.split('T')[1]; // HH:MM
                if (!slotMap.has(time)) {
                    slotMap.set(time, []);
                }
                slotMap.get(time).push(slot);
            });
            
            // Render slots
            slotMap.forEach((timeSlots, time) => {
                const row = document.createElement('div');
                row.style.display = 'flex';
                row.style.marginBottom = '10px';
                
                // Time label
                const timeLabel = document.createElement('div');
                timeLabel.textContent = time;
                timeLabel.style.width = '80px';
                timeLabel.style.textAlign = 'right';
                timeLabel.style.paddingRight = '10px';
                row.appendChild(timeLabel);
                
                // Slot cells
                timeSlots.forEach(slot => {
                    slot.available_table_ids.forEach(tableId => {
                        const cell = document.createElement('div');
                        cell.className = 'cell available';
                        cell.dataset.tableId = tableId;
                        cell.dataset.time = time;
                        cell.dataset.available = 'true';
                        cell.textContent = tableId;
                        
                        // Add click handler for booking
                        cell.addEventListener('click', () => {
                            if (!currentUser) {
                                // Redirect to login or show auth error
                                window.location.href = '/login';
                                return;
                            }
                            
                            // Set the selected reservation
                            currentReservation = {
                                table_id: tableId,
                                restaurant_id: restaurantId,
                                starts_at_local: `${dateInput.value}T${time}`,
                                party_size: parseInt(partySizeInput.value)
                            };
                            
                            // Show booking form
                            showBookingForm();
                        });
                        
                        row.appendChild(cell);
                    });
                    
                    // Add combination cells if available
                    if (slot.available_options) {
                        slot.available_options.forEach(option => {
                            if (option.table_ids.length > 1) {
                                const combinationId = option.table_ids.join('+');
                                const cell = document.createElement('div');
                                cell.className = 'cell available';
                                cell.dataset.tableIds = combinationId;
                                cell.dataset.time = time;
                                cell.dataset.available = 'true';
                                cell.textContent = combinationId.replace('+', ' & ');
                                
                                // Add click handler for booking
                                cell.addEventListener('click', () => {
                                    if (!currentUser) {
                                        // Redirect to login or show auth error
                                        window.location.href = '/login';
                                        return;
                                    }
                                    
                                    // Set the selected reservation
                                    currentReservation = {
                                        table_ids: option.table_ids,
                                        restaurant_id: restaurantId,
                                        starts_at_local: `${dateInput.value}T${time}`,
                                        party_size: parseInt(partySizeInput.value)
                                    };
                                    
                                    // Show booking form
                                    showBookingForm();
                                });
                                
                                row.appendChild(cell);
                            }
                        });
                    }
                });
                
                availabilityGrid.appendChild(row);
            });
        }
        
        // Show booking form
        function showBookingForm() {
            if (!currentReservation) return;
            
            // Set form values
            bookingSummary.textContent = currentReservation.table_ids ? 
                `Selected tables: ${currentReservation.table_ids.join(', ')}` : 
                `Selected table: ${currentReservation.table_id}`;
            bookingPartySize.value = currentReservation.party_size;
            
            // Show form
            bookingForm.style.display = 'block';
            confirmation.style.display = 'none';
            bookingError.style.display = 'none';
        }
        
        // Book table
        async function bookTable() {
            if (!currentReservation) return;
            
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = '/login';
                return;
            }
            
            // Prepare booking request
            const bookingData = {
                restaurant_id: currentReservation.restaurant_id,
                starts_at_local: currentReservation.starts_at_local,
                party_size: parseInt(bookingPartySize.value)
            };
            
            // Add table_id or table_ids
            if (currentReservation.table_id) {
                bookingData.table_id = currentReservation.table_id;
            } else if (currentReservation.table_ids) {
                bookingData.table_ids = currentReservation.table_ids;
            }
            
            try {
                // Send booking request
                const response = await fetch('/reservations', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`,
                        'Idempotency-Key': `booking_${Date.now()}`
                    },
                    body: JSON.stringify(bookingData)
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // Show confirmation
                    confirmationReference.textContent = data.reference;
                    confirmationDetails.textContent = `Restaurant: ${data.restaurant_id}, Table(s): ${data.table_ids ? data.table_ids.join(', ') : data.table_id}, Time: ${data.starts_at_local}`;
                    confirmation.style.display = 'block';
                    bookingForm.style.display = 'none';
                    bookingError.style.display = 'none';
                } else {
                    bookingError.textContent = data.error?.message || 'Booking failed';
                    bookingError.style.display = 'block';
                }
            } catch (error) {
                console.error('Error booking table:', error);
                bookingError.textContent = 'Network error while booking table';
                bookingError.style.display = 'block';
            }
        }
        
        // Logout
        function logout() {
            localStorage.removeItem('token');
            currentUser = null;
            currentUserSpan.textContent = '';
            logoutButton.style.display = 'none';
            window.location.href = '/';
        }
        
        // Initialize when page loads
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
